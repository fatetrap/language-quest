<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Language Quest · Language Quest</title>
<style>
/* 16-bit JRPG look (SNES era): pixel fonts from assets/fonts.js ("Yarya Pixel" = Press Start 2P for the UI chrome, "Yarya Uni"
   = GNU Unifont for every learning text, crisp at 16 / 24 / 32 / 48 px), bevelled gradient windows, pixel art from pixel.js at
   an integer scale (--px). Text colours meet WCAG AA (4.5:1) on both ends of every window gradient in both themes; text sits
   on windows, never on the art. Dark theme = blue windows + dusk / night scenes, light = parchment windows + day scenes */
:root{--px:2;--fs:16px;--lh:24px;--fo:24px;--big:32px;--word:32px;
  --pix:"Yarya Pixel","Yarya Uni","Courier New",monospace;--uni:"Yarya Uni","Segoe UI","Noto Sans",Arial,sans-serif;
  --bg:#0b0b22;--bg2:#17173c;--w1:#3646b4;--w2:#121a6a;--wl:#e8ecff;--wm:#7e88d0;--wd:#03031a;
  --ink:#ffffff;--muted:#d4dcff;--dim:#c4ccf4;--gold:#ffe060;--acc:#a0e8ff;--red:#ff5a5a;--red-tx:#ffc4bc;--good:#58e070;--good-ink:#b4ffb8;
  --sel:#26339c;--sh:#000000;--field:#080c3c;--track:#05061e;--good-soft:#0e4a2a;--red-soft:#5a1020}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#d8ceb2;--bg2:#c8bc9a;--w1:#fffaf0;--w2:#efdfba;--wl:#4a3018;--wm:#c4a274;--wd:#1e1208;
  --ink:#1a1226;--muted:#43365a;--dim:#4c3f60;--gold:#7a3a00;--acc:#16468e;--red:#c41818;--red-tx:#9a1010;--good:#1a8a3a;--good-ink:#0a5a24;
  --sel:#f6dc98;--sh:transparent;--field:#fffdf6;--track:#5a4028;--good-soft:#d6f5d6;--red-soft:#fbdcd6}}
:root[data-theme="light"]{--bg:#d8ceb2;--bg2:#c8bc9a;--w1:#fffaf0;--w2:#efdfba;--wl:#4a3018;--wm:#c4a274;--wd:#1e1208;
  --ink:#1a1226;--muted:#43365a;--dim:#4c3f60;--gold:#7a3a00;--acc:#16468e;--red:#c41818;--red-tx:#9a1010;--good:#1a8a3a;--good-ink:#0a5a24;
  --sel:#f6dc98;--sh:transparent;--field:#fffdf6;--track:#5a4028;--good-soft:#d6f5d6;--red-soft:#fbdcd6}
@media (min-width:900px){:root{--fs:24px;--lh:32px;--big:32px;--word:48px}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/var(--lh) var(--uni);overflow-x:hidden;-webkit-font-smoothing:none}
h1,h2,h3{margin:0;font-weight:400}
h1,h2,.btn,.logo,.k,.lab,.pill,.chead,.plate,.enc,.lvhd,.lvsum,.tile .tk,.flag,.kick{font-family:var(--pix);font-weight:400}
button,a.btn,a.ibtn{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:10px 8px 24px}
.muted{color:var(--muted)}
.latin{color:var(--acc);font-family:var(--uni)}
/* the window: gradient, light bevel, dark rim, hard drop shadow (one look for every panel) */
.win{position:relative;background:linear-gradient(var(--w1),var(--w2));color:var(--ink);border:3px solid var(--wl);border-radius:8px;
  box-shadow:0 0 0 2px var(--wd),inset 0 0 0 2px var(--wm),inset 0 0 0 3px var(--wd),4px 5px 0 2px #00000045;text-shadow:1px 1px 0 var(--sh)}
/* the pointing hand (CSS pixel art from pixel.js in --hand) on the command under the cursor */
.btn::before,.opt::before,.choose button::before,.lvsum::before,.enc.next::before{content:"";position:absolute;width:2px;height:2px;box-shadow:var(--hand);pointer-events:none;visibility:hidden}
.btn::before,.choose button::before,.lvsum::before{left:7px;top:calc(50% - 10px)}
.btn:hover:not(:disabled)::before,.btn:focus::before,.choose button:hover::before,.choose button:focus-visible::before,.lvsum:hover::before,.lvsum:focus-visible::before,
.opt.cur:not(:disabled)::before{visibility:visible;animation:point .5s steps(1) infinite}
@keyframes point{50%{transform:translateX(3px)}}
/* buttons: small windows with the pixel font */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px 10px 38px;font-size:16px;line-height:24px;
  color:var(--ink);background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--wl);border-radius:8px;box-shadow:0 0 0 2px var(--wd),inset 0 0 0 2px var(--wm);text-shadow:2px 2px 0 var(--sh)}
.btn:hover:not(:disabled),.btn:focus-visible{color:var(--gold)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--bg2);border-color:var(--wm);color:var(--ink)}
.btn.wide{width:100%}
.ibtn{width:40px;height:40px;flex:none;border:2px solid var(--wm);border-radius:6px;background:var(--field);color:var(--ink);display:grid;place-items:center;padding:0;font:20px/1 var(--uni)}
.ibtn:hover{border-color:var(--gold)}
.ibtn[aria-pressed="false"]{color:var(--dim);border-style:dashed}
/* top bar */
.top{position:sticky;top:0;z-index:20;padding:6px 6px 0;background:var(--bg)}
.top .in{max-width:900px;margin:0 auto;padding:6px 8px;display:flex;align-items:center;gap:6px}
.logo{margin-right:auto;font-size:16px;color:var(--gold);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--sh)}
.pill{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 8px;font:16px/1 var(--uni);white-space:nowrap;color:var(--ink)}
.pill.xp{color:var(--gold)}.pill.streak{color:var(--acc)}
@media (max-width:420px){.logo .nm{display:none}.pill{padding:0 4px}.top .in{gap:4px;padding:6px}.ibtn{width:36px;height:36px;font-size:18px}}
/* pixel art: canvases at an integer scale, never smoothed; a faint scanline on the scenes */
.scene{position:relative;overflow:hidden;background:var(--bg2)}
.scene>canvas{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:block;image-rendering:pixelated}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 calc(var(--px) * 1px - 1px),#00000012 0 calc(var(--px) * 1px))}
.spr{display:block;image-rendering:pixelated;width:calc(var(--w) * var(--px) * 1px);height:calc(var(--h) * var(--px) * 1px)}
.spr.mini{--px:1}
@media (min-width:900px){.spr.mini{--px:2}}
/* title screen: language chooser */
.splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.splash .scene{height:clamp(220px,46vh,420px);flex:none}
.splash .duo{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:clamp(40px,12vw,160px);align-items:flex-end}
.splash .wrap{width:100%;margin-top:-46px;position:relative}
.logo-win{text-align:center;padding:16px 12px 14px}
.logo-win h1{font-size:clamp(20px,6vw,40px);line-height:1.3;color:var(--gold);text-shadow:3px 3px 0 var(--sh);letter-spacing:.04em}
.logo-win .muted{margin-top:6px}
.choose{display:grid;gap:12px;margin-top:14px}
.choose button{position:relative;text-align:left;padding:14px 14px 14px 40px;display:flex;gap:14px;align-items:center}
.choose button:hover b,.choose button:focus-visible b{color:var(--gold)}
.choose .flag{font-size:12px;border:2px solid var(--wm);border-radius:4px;color:var(--acc);padding:8px;white-space:nowrap;background:var(--field)}
.choose b{display:block;font-weight:400;font-size:var(--fo);line-height:1.3}
/* onboarding: a dialogue box over the scene */
.onb{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.onb>.scene{position:absolute;inset:0}
.onb .card{position:relative;max-width:760px;width:100%;padding:24px 20px 18px;animation:rise .35s steps(5) both}
.onb .dots{display:flex;gap:8px;margin-bottom:16px}
.onb .dots i{flex:1;height:6px;background:var(--track);border:1px solid var(--wm)}.onb .dots i.on{background:var(--gold)}
.onb h2{font-size:clamp(16px,4vw,24px);line-height:1.4;color:var(--gold);text-shadow:2px 2px 0 var(--sh)}
.onb p{margin:12px 0 18px;min-height:calc(var(--lh) * 3)}
.onb .skip{margin-right:auto;background:none;border:0;color:var(--muted);font:12px var(--pix);padding:8px 4px;min-height:44px;text-decoration:underline}
.onb .row{justify-content:flex-end;align-items:center}
@media (max-width:560px){.onb .row .btn{width:auto;flex:1}}
/* camp: the world map, the next encounter, the chapter's units as trails of stepping stones */
.mapwin{margin-bottom:14px;overflow:hidden;padding:0}
.mhead{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font:12px/18px var(--pix);color:var(--gold)}
.mhead span:last-child{color:var(--ink);flex:none}
.mapbox{position:relative;overflow:hidden;height:clamp(150px,28vw,250px);border-top:3px solid var(--wl);background:var(--bg2);border-radius:0 0 5px 5px}
.mapbox canvas{position:absolute;left:0;top:0;display:block;image-rendering:pixelated}
.mapnode{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;background:transparent;border:0;border-radius:6px;padding:0}
.mapnode:hover{outline:2px solid var(--gold)}
.hero{margin-bottom:14px;overflow:hidden}
.hbanner{position:relative;height:clamp(130px,22vw,190px);border-bottom:3px solid var(--wl);border-radius:5px 5px 0 0;overflow:hidden}
.hbanner .scene{position:absolute;inset:0}
.hcast{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12%}
.hero .tx{padding:12px 14px 14px}
.hero .who{color:var(--gold)}
.hero .intro{margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.k{font-size:12px;line-height:18px;color:var(--acc)}
.hero h2{font-size:clamp(14px,3vw,20px);line-height:1.4;color:var(--ink);margin:6px 0 4px;text-shadow:2px 2px 0 var(--sh)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.tagx{border:2px solid var(--wm);border-radius:4px;padding:0 8px;color:var(--ink);background:var(--field)}
.tagx.boss{border-color:var(--red);color:var(--red-tx)}
.note{margin:0 0 14px;padding:10px 14px;color:var(--muted)}
.lvhd{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:12px;line-height:18px;color:var(--gold);text-shadow:2px 2px 0 var(--sh)}
.lvhd::before,.lvhd::after{content:"";flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--wm) 0 6px,transparent 6px 10px)}
.unit{padding:12px;margin-bottom:12px}
.unit h3{font-size:var(--fs);line-height:var(--lh);margin-top:2px}
.unit .s{color:var(--muted)}
.trail{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;align-items:center}
.enc{position:relative;min-width:44px;height:44px;border:3px solid var(--wl);border-radius:8px;background:var(--field);color:var(--ink);font-size:12px;
  display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2px var(--wd)}
.enc:not(:last-child)::after{content:"";position:absolute;right:-14px;top:calc(50% - 2px);width:10px;height:4px;background:repeating-linear-gradient(90deg,var(--wm) 0 4px,transparent 4px 6px);pointer-events:none}
.enc:hover:not(:disabled){border-color:var(--gold)}
.enc.won{background:linear-gradient(#ffe878,#c88a10);color:#2a1800;text-shadow:none}
.enc.known{border-style:dashed;color:var(--acc)}
.enc.next{border-color:var(--gold);animation:glow 1s steps(2) infinite}
.enc.next::before{visibility:visible;left:4px;top:-26px;transform:rotate(90deg);animation:bob .5s steps(1) infinite}
.enc.locked{opacity:.45}
.enc.boss{padding:0 10px;background:linear-gradient(#b02838,#580818);color:#ffffff;border-color:#ffc4bc;text-shadow:1px 1px 0 #000}
.lvsum{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 12px 12px 40px;margin-bottom:10px;font-size:12px;line-height:18px;
  background:linear-gradient(var(--w1),var(--w2));color:var(--ink);border:3px solid var(--wm);border-radius:8px;box-shadow:0 0 0 2px var(--wd)}
.lvsum:hover,.lvsum:focus-visible{border-color:var(--wl);color:var(--gold)}
.applink{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-top:22px}
.applink .tx{flex:1}
.applink b{font-weight:400;color:var(--gold)}
.applink .ico{font-size:32px}
.keys{display:none;margin-top:10px;color:var(--muted)}
@media (hover:hover) and (min-width:760px){.keys{display:block}}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
/* fight: HUD / stage (scene + both fighters + speech window) / board (the current card) / console (the command window) */
.fight{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.fight.hit{animation:shake .4s steps(8) both}
.flash{position:absolute;inset:0;background:#ff2020;opacity:0;pointer-events:none;z-index:40}
.flash.on{opacity:.35}
.flash.heal{background:#40ff60}
.hud{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px 16px;align-items:center;margin:6px 6px 0;padding:6px 12px;z-index:5}
.lab{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;line-height:18px;color:var(--muted);min-width:0}
.lab>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab b{font-weight:400;color:var(--ink);white-space:nowrap}
.hp,.mp,.ruler{height:12px;background:var(--track);border:2px solid var(--wl);border-radius:3px;margin-top:3px;overflow:hidden}
.mp{height:8px;margin-top:3px}
.hp i,.mp i,.ruler i{display:block;height:100%;width:100%;transition:width .35s steps(5)}
.hp i{background:linear-gradient(#b4ffb8 0 35%,#38c048 35%)}
.hp.mid i{background:linear-gradient(#fff4a8 0 35%,#e0b818 35%)}
.hp.low i{background:linear-gradient(#ffc0b0 0 35%,#e02828 35%)}
.hud .low b{color:var(--red-tx)}
.mp i{background:linear-gradient(#c8e8ff 0 35%,#3890f0 35%)}
.ruler i{background:linear-gradient(#ffb8a8 0 35%,#c82838 35%)}
.opp{display:flex;gap:10px;align-items:center;justify-content:flex-end;text-align:right;min-width:0}
.opp .nm{font:16px/24px var(--pix);color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:2px 2px 0 var(--sh)}
.opp .role{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flee{width:32px;height:28px;font-size:16px;margin-left:6px}
@media (max-width:600px){.hud{grid-template-columns:1fr 1fr;gap:2px 10px;padding:6px 10px}.hud .mid{grid-column:1/-1;order:3}.opp .spr{display:none}.opp .nm{font-size:12px;line-height:18px}.opp .role{font-size:16px;line-height:20px}}
.arena{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:none;min-height:clamp(128px,28vh,264px);display:flex;align-items:flex-end;margin:6px 6px 0;border:3px solid var(--wl);border-radius:8px;
  box-shadow:0 0 0 2px var(--wd);overflow:hidden}
.stage>.scene{position:absolute;inset:0}
.fight[data-phase="duel"] .stage{min-height:clamp(120px,24vh,250px)}
/* the level guard looms one scale step larger on a taller stage */
.fight.boss .stage{min-height:clamp(150px,30vh,290px)}
.foe .spr.big{width:calc(var(--w) * (var(--px) + 1) * 1px);height:calc(var(--h) * (var(--px) + 1) * 1px)}
.cast{position:relative;display:flex;align-items:flex-end;gap:12px;width:100%;max-width:1000px;margin:0 auto;padding:8px 10px 6px}
.npc{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:140px}
.npc.mine{align-self:flex-end;padding-bottom:32px}
.plate{max-width:140px;color:var(--gold);padding:2px 8px;font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actor{position:relative}
.actor .spr{transform-origin:50% 100%}
.actor.hurt .spr{animation:hurt .5s steps(1) both}
.foe.lunge .spr{animation:lungeR .4s steps(4) both}
.me.lunge .spr{animation:lungeL .4s steps(4) both}
.actor.glow .spr{animation:glowup .6s steps(3) both}
.slash{position:absolute;inset:-10% -20%;pointer-events:none;background:linear-gradient(135deg,transparent 46%,#ffffff 47% 53%,transparent 54%);animation:slash .3s steps(3) both}
.pop{position:absolute;left:50%;top:0;z-index:6;font:16px/1 var(--pix);color:#ffffff;white-space:nowrap;pointer-events:none;
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:pop 1s steps(10) both}
.pop.dmg{color:#ff9a8a}.pop.heal{color:#90ff98}.pop.crit{color:#ffe060;font-size:12px}
.bubble{position:relative;flex:1;min-width:0;max-width:560px;max-height:34vh;overflow-y:auto;align-self:flex-end;margin:0 0 24px;padding:8px 14px}
.bubble::before{content:"";position:absolute;left:-15px;bottom:12px;border:7px solid transparent;border-right:8px solid var(--wl)}
.bubble.ok{border-color:var(--good)}.bubble.no{border-color:var(--red)}
.bubble:empty{display:none}
.tw{visibility:hidden}
@media (max-width:420px){.plate{max-width:84px}.npc{max-width:84px}.bubble{margin-bottom:18px;padding:6px 10px}.cast{gap:8px;padding:6px}}
/* the board: one window at a time (story, a word to learn, the question), notes below it */
.board{flex:1;min-height:64px;overflow-y:auto;background:var(--bg)}
.board>.in{max-width:860px;margin:0 auto;padding:10px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
.say{padding:12px 16px;animation:rise .25s steps(4) both}
.say.m{justify-self:end;max-width:90%;padding:6px 14px;color:var(--gold)}
.say.m::before{content:attr(data-who) ": ";color:var(--muted)}
.say .k{margin-bottom:6px}
.say .big{font:var(--big)/1.25 var(--uni);color:var(--ink);overflow-wrap:anywhere;text-shadow:2px 2px 0 var(--sh)}
.say .tr{margin-top:6px}
.story p{margin:0}
.typed.more::after{content:" ▼";color:var(--gold);animation:blink .8s steps(1) infinite}
/* the new word is the hero of its window */
.teach{text-align:center;padding:14px 16px 16px;border-color:var(--gold)}
.teach .word{font:var(--word)/1.15 var(--uni);color:var(--ink);overflow-wrap:anywhere;text-shadow:2px 2px 0 var(--sh);animation:shine .6s steps(3) both}
.teach .trow{display:flex;gap:6px 12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:4px}
.teach .rom{color:var(--acc)}
.teach .trow .phon{margin:0}
.teach .mean{font:24px/32px var(--uni);color:var(--gold);margin-top:8px}
.teach .pos{display:inline-block;border:2px solid var(--wm);border-radius:4px;padding:0 8px;color:var(--muted);background:var(--field)}
.teach .ex{border-top:3px dotted var(--wm);margin-top:12px;padding-top:10px;text-align:left}
.teach .ex .latin{display:block}
.phon{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px;color:var(--acc)}
.ask .phon{justify-content:flex-start}
.phon b{font-weight:400;color:var(--acc)}
.phon button{border:2px solid var(--wm);border-radius:6px;background:var(--field);color:var(--ink);padding:2px 10px;min-height:36px}
.say .blank{font:var(--big)/1.3 var(--uni);color:var(--ink)}
.slot{display:inline-block;min-width:70px;border-bottom:4px solid var(--gold);text-align:center;padding:0 6px;color:var(--gold)}
/* grammar: one short line, "more" opens the explanation (never shouted in capitals) */
.tip summary{display:flex;align-items:baseline;gap:8px;padding:10px 12px;cursor:pointer;list-style:none;min-height:44px}
.tip summary::-webkit-details-marker{display:none}
.tip .lbl{flex:none;color:var(--acc)}
.tip .gt{flex:1;min-width:0}
.tip:not([open]) .gt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .more{flex:none;color:var(--gold);text-decoration:underline}
.tip .more::after{content:attr(data-more)}.tip[open] .more::after{content:attr(data-less)}
.tip .body{padding:0 12px 12px}
.tip .body p{margin:0 0 8px;white-space:pre-line}
.gex{border-top:2px dotted var(--wm);padding:6px 0}
.gex b{font-weight:400;margin-right:8px;color:var(--gold)}
.sys{justify-self:center;max-width:100%;padding:6px 14px;text-align:center;animation:rise .25s steps(4) both}
.sys b{font-weight:400;color:var(--red-tx);margin-right:6px}
.sys.heal{color:var(--good-ink);border-color:var(--good)}
.recap{justify-self:stretch;text-align:left}
.recap ul{margin:6px 0 0;padding-left:20px}.recap li{margin:2px 0}.recap .w{color:var(--gold)}
/* the command window */

    if (over) return;
    const go = h('button', { class: 'btn go', onclick: cont }, t('cont'));
    cin.append(h('div', { class: 'verdict ' + (r.ok ? 'ok' : 'no'), role: 'status' },
      h('div', { class: 'v' }, r.ok ? (r.almost ? t('almost') : t('right')) : r.timeout ? t('timeout') : t('wordWas'),
        (!r.ok || r.almost) && r.answer ? h('div', {}, r.answer) : null, r.explain ? h('div', { class: 'muted' }, r.explain) : null), go));
    cons.setAttribute('data-round', 'next');
    go.focus();
    if (r.ok && !r.almost) pending = later(cont, AUTO);
  }
  function cont() {
    if (pending) { clearTimeout(pending); pending = null; }
    if (!waiting || over) return;
    i++; round();
  }
  // ----- the end: victory fanfare (XP, the words learned; lesson done when all its parts are won) or game over
  //       (retry keeps the words) -----
  function overlay(win, tiles, buttons, words) {
    CHIP.music(null);
    const title = win ? t('victory') : t('defeat');
    const duo = h('div', { class: 'duo', 'aria-hidden': 'true' }, h('div', { class: 'actor ' + (win ? 'cheer' : 'ko') }, heroSprite()), h('div', { class: 'actor' + (win ? ' beaten' : '') }, spr(foeName)));
    const ov = h('div', { class: 'over ' + (win ? 'victory' : 'defeat'), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('div', { class: 'box win' }, h('div', { class: 'kick' }, win ? `★ ${sc.place} ★` : t('gameOver')), h('h1', { class: 'glitch', 'data-text': title }, title), duo,
        h('p', { class: 'line' }, win ? sc.win || tf('victorySub', { who: sc.who }) : sc.lose || t('defeatSub')),
        !win && sc.lose ? h('p', {}, t('defeatSub')) : null,
        h('div', { class: 'tiles' }, tiles.map(([k, v]) => h('div', { class: 'tile' }, h('div', { class: 'tk' }, k), h('div', { class: 'tv' }, v)))),
        words && words.length ? h('div', { class: 'learned win' }, h('div', { class: 'k' }, t('learnedNew')),
          h('ul', {}, words.map(id => h('li', {}, h('span', { class: 'w', lang: tg }, item(id)[tg]), tg === 'mn' ? ` [${item(id).mn_latin || romanize(item(id).mn)}]` : '', ' = ', item(id)[native])))) : null,
        h('div', { class: 'row' }, buttons)));
    document.body.append(ov); buttons[0].focus();
    // the XP counts up like an EXP tally
    const xv = ov.querySelector('.tile .tv'), goal = xv && /^\+(\d+)$/.exec(xv.textContent);
    if (goal && !reduceMotion()) { let n = 0; const N = +goal[1], id = setInterval(() => { n = Math.min(N, n + Math.max(1, Math.ceil(N / 12))); xv.textContent = '+' + n; if (n % 2) Sound.play('text'); if (n >= N) clearInterval(id); }, 45); }
    onKey = ev => { if (ev.key === 'Enter') { ev.preventDefault(); (ov.contains(document.activeElement) && document.activeElement.matches('button') ? document.activeElement : buttons[0]).click(); }
      else if (ev.key === 'Escape') { ev.preventDefault(); camp(); } else if (arrowNav(ev, ov)) ev.preventDefault(); };
  }
  const acc = () => graded ? Math.round(100 * right / graded) + '%' : '-';
  function victory() {
    cleanup(); setConsole('end', null);
    const s = qload(); s.won[e.id] = Date.now(); s.best = Math.max(s.best, qs.best); qsave(s);
    const xp = R.xp + right + (right === graded ? 5 : 0);
    P.addXP(xp, GAME);
    if (e.lesson && Q.campaign().filter(x => x.lesson === e.lesson).every(x => s.won[x.id])) P.lessonDone(e.lesson, GAME);
    Sound.play('victory');
    const nx = Q.state(s.won).next;
    overlay(true, [[t('xp'), '+' + xp], [t('acc'), acc()], [t('learned'), String(plan.teach.length + plan.recap.length)]],
      [nx ? h('button', { class: 'btn', onclick: () => fight(nx) }, t('nextEnc')) : h('button', { class: 'btn', onclick: camp }, t('toCamp')),
       nx ? h('button', { class: 'btn ghost', onclick: camp }, t('toCamp')) : null].filter(Boolean), [...plan.teach, ...plan.recap]);
  }
  function defeat() {
    cleanup(); setConsole('end', null);
    const xp = Math.floor(right / 2); if (xp) P.addXP(xp, GAME);
    Sound.play('defeat');
    overlay(false, [[t('xp'), '+' + xp], [t('acc'), acc()], [t('round'), `${i + 1}/${queue.length}`]],
      [h('button', { class: 'btn', onclick: () => fight(e, true) }, '↻ ' + t('retry')), h('button', { class: 'btn ghost', onclick: camp }, t('toCamp'))]);
  }
  function askRetreat() {
    if (modal || over) return;
    const m = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': t('retreatQ'), onclick: ev => ev.target === m && close() });
    function close() { modal = null; m.remove(); }
    const stay = h('button', { class: 'btn wide', onclick: close }, t('stay'));
    m.append(h('div', { class: 'sheet win' }, h('h3', {}, t('retreatQ')), h('p', { class: 'muted' }, t('retreatSub')), stay,
      h('button', { class: 'btn ghost wide', onclick: () => { close(); cleanup(); camp(); } }, t('retreat'))));
    modal = { close, m }; document.body.append(m); stay.focus();
  }
  onKey = ev => {
    if (modal) { if (ev.key === 'Escape') modal.close(); else if (arrowNav(ev, modal.m)) ev.preventDefault(); return; }
    if (over) return;
    const inText = ev.target && ev.target.tagName === 'TEXTAREA';
    if (ev.key === 'Escape') { ev.preventDefault(); askRetreat(); }
    else if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      if (typing) typing.finish();                                 // the first Enter shows the whole story text
      else if (!st) { const b = cin.querySelector('.got'); if (b) b.click(); }
      else if (waiting) cont(); else if (cur.enter) cur.enter();
      else { const c = cin.querySelector('.opt.cur:not(:disabled)'); if (c) c.click(); }
    }
    else if (!inText && /^[1-9]$/.test(ev.key) && st && !waiting && cur.key) cur.key(+ev.key);
    else if (!inText && ev.key === 'Backspace' && st && !waiting && cur.back) { ev.preventDefault(); cur.back(); }
    else if (!inText && arrowNav(ev, cons)) ev.preventDefault();
  };
  hudUpdate();
  opening();
}
start();
</script>
