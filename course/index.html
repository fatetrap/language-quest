<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Language Quest</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#677086;--line:#e1e5ee;--chip:#eef1f7;--locked:#dde2ea;
  --accent:#2f6fed;--accent-ink:#fff;--accent-soft:#e7eefe;--good:#1f9d55;--good-soft:#e2f6ea;--bad:#d9434b;
  --bad-soft:#fdeaea;--gold:#f2a516;--gold-soft:#fff3d6;--shadow:0 1px 2px #0000000d,0 6px 20px #1a28500f;--top:color-mix(in srgb,var(--bg) 86%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10141b;--card:#1a2029;--ink:#e7eaf0;
  --muted:#98a1b2;--line:#2a313d;--chip:#232a35;--locked:#2c3440;--accent:#5b8cff;--accent-ink:#0b1220;--accent-soft:#1c2a47;
  --good:#3cc777;--good-soft:#143021;--bad:#f06a70;--bad-soft:#3a1d20;--gold:#f7b733;--gold-soft:#3a2e12;--shadow:0 1px 2px #0006}}
:root[data-theme="dark"]{--bg:#10141b;--card:#1a2029;--ink:#e7eaf0;--muted:#98a1b2;--line:#2a313d;--chip:#232a35;
  --locked:#2c3440;--accent:#5b8cff;--accent-ink:#0b1220;--accent-soft:#1c2a47;--good:#3cc777;--good-soft:#143021;--bad:#f06a70;
  --bad-soft:#3a1d20;--gold:#f7b733;--gold-soft:#3a2e12;--shadow:0 1px 2px #0006}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h2,h3{margin:0;line-height:1.25}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
.latin{color:var(--muted);font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
/* chunky 3D buttons */
.btn{--c:var(--accent);--ci:var(--accent-ink);border:0;border-radius:16px;padding:14px 24px;font-weight:800;font-size:16px;
  letter-spacing:.02em;background:var(--c);color:var(--ci);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 62%,#000);
  transition:transform .08s,box-shadow .08s,filter .15s;min-height:50px}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent}
.btn:disabled{--c:var(--locked);--ci:var(--muted);box-shadow:none}
.btn.good{--c:var(--good);--ci:#fff}
.btn.bad{--c:var(--bad);--ci:#fff}
.btn.gold{--c:var(--gold);--ci:#3b2600}
.btn.ghost{--c:var(--card);--ci:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--top);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.02em;margin-right:auto;min-width:0}
.mark{width:36px;height:36px;flex:none;border-radius:12px 12px 12px 4px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;
  background:linear-gradient(135deg,#2f6fed,#14b8a6);box-shadow:0 3px 0 #1b4fb8}
.logo .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-weight:800;font-size:14px;white-space:nowrap}
.pill.streak{color:#e8590c}.pill.streak.off{color:var(--muted);filter:grayscale(1)}
.pill.xp{color:var(--gold)}
.ibtn{width:36px;height:36px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px;display:grid;place-items:center;padding:0}
.ring{--p:0;width:36px;height:36px;flex:none;border-radius:50%;position:relative;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--chip) 0);transition:--p .6s}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative}
.ring.full{box-shadow:0 0 0 2px var(--gold-soft),0 0 12px color-mix(in srgb,var(--gold) 50%,transparent)}
@media (max-width:480px){.logo .nm{display:none}}
@media (max-width:370px){.pill{padding:0 7px}.top .in{gap:4px;padding:8px}}
/* home */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .tx{flex:1;min-width:180px}
.hero .k{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.hero h2{font-size:19px;margin:2px 0}
.bar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#14b8a6);border-radius:999px}
.keys{display:none;font-size:12px;margin-top:8px}
@media (hover:hover) and (min-width:760px){.keys{display:block}}
.practice{display:flex;align-items:center;gap:12px}
.practice .ico{font-size:28px}
.practice .tx{flex:1}
.questcard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1a1410,#451a03);color:#fcd34d;border-color:#5c4a3d}
.questcard .ico{font-size:28px}
.questcard .tx{flex:1;min-width:0}
.questcard .muted{color:#d6c3a5}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
details.stats{font-size:14px;color:var(--muted);padding:0}
details.stats summary{cursor:pointer;padding:12px 16px;list-style:none;display:flex;gap:8px;align-items:center}
details.stats summary::-webkit-details-marker{display:none}
details.stats summary::after{content:"▾";margin-left:auto;transition:transform .2s}
details.stats[open] summary::after{transform:rotate(180deg)}
details.stats b{color:var(--ink)}
.stats .body{padding:0 16px 14px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:8px}
.stat{background:var(--chip);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:18px}
.levelhd{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font-weight:900;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.levelhd::before,.levelhd::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.banner{--lv:var(--accent);background:var(--lv);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center;
  box-shadow:0 4px 0 color-mix(in srgb,var(--lv) 62%,#000);margin-top:20px}
.banner .tx{flex:1;min-width:0}
.banner .k{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85}
.banner h2{font-size:18px}
.banner .s{font-size:14px;opacity:.85}
.banner .n{background:#ffffff2e;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.banner.soon{filter:saturate(.25);opacity:.75}
.path{position:relative;margin:12px auto 8px;width:100%;max-width:320px}
.track{position:absolute;left:50%;top:0;margin-left:-160px;overflow:visible;pointer-events:none}
.track path{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round;stroke-dasharray:2 16}
.track path.done{stroke:var(--gold);stroke-dasharray:none;opacity:.55}
.node{--lv:var(--accent);position:absolute;width:72px;height:72px;border-radius:50%;border:0;padding:0;font-weight:900;font-size:24px;
  background:var(--lv);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--lv) 60%,#000),inset 0 -4px 0 #0000001a;transition:transform .1s,box-shadow .1s}
.node:active:not(.locked){transform:translateY(6px);box-shadow:0 0 0 transparent}
.node.done{--lv:var(--gold);color:#3b2600}
.node.locked{background:var(--locked);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--locked) 75%,#000);font-size:20px}
.node.next{animation:pulse 2s infinite}
.node .bubble{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%);background:var(--card);color:var(--lv);
  border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-size:14px;font-weight:900;letter-spacing:.06em;white-space:nowrap;
  text-transform:uppercase;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.node .bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
.pop{position:absolute;left:50%;width:min(280px,100%);transform:translateX(-50%);z-index:5;background:var(--card);border:2px solid var(--line);
  border-radius:18px;padding:14px;box-shadow:var(--shadow);animation:popIn .18s ease-out}
.pop::before{content:"";position:absolute;bottom:100%;left:calc(50% + var(--ax,0px) - 9px);border:9px solid transparent;border-bottom-color:var(--line)}
.pop h3{font-size:17px}
.pop .btn{margin-top:12px}
.choose{display:grid;gap:14px;margin-top:28px}
.choose button{text-align:left;padding:20px;border-radius:20px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);
  display:flex;gap:14px;align-items:center;transition:transform .1s,border-color .15s}
.choose button:hover{border-color:var(--accent)}
.choose button:active{transform:translateY(3px)}
.choose .flag{font-size:13px;font-weight:900;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px;white-space:nowrap}
.choose b{display:block;font-size:20px}
.splash{text-align:center;padding-top:40px}
.splash .mark{width:84px;height:84px;font-size:46px;margin:0 auto 14px;border-radius:26px 26px 26px 8px;box-shadow:0 6px 0 #1b4fb8;animation:popIn .5s}
.splash h1{margin:0;font-size:32px;letter-spacing:-.02em}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
/* lesson */
.lesson{min-height:100vh;display:flex;flex-direction:column}
.lbar{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:720px;width:100%;margin:0 auto}
.x{border:0;background:none;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:10px}
.prog{flex:1;height:16px;background:var(--chip);border-radius:999px;overflow:hidden;position:relative}
.prog i{display:block;height:100%;width:0;background:var(--good);border-radius:999px;transition:width .45s cubic-bezier(.3,1.3,.5,1),background .3s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:#ffffff59}
.prog.combo i{background:linear-gradient(90deg,var(--gold),#ff7a1a,var(--gold));background-size:200% 100%;animation:shimmer 1.2s linear infinite;
  box-shadow:0 0 14px color-mix(in srgb,var(--gold) 70%,transparent)}
.combo-tag{font-weight:900;color:#ff7a1a;font-size:14px;white-space:nowrap;min-width:44px;text-align:right}
.combo-tag.on{animation:popIn .3s}
.stage{flex:1;max-width:680px;width:100%;margin:0 auto;padding:8px 16px 190px}
.step{animation:stepIn .32s cubic-bezier(.2,.8,.3,1)}
.shake{animation:shake .4s}
.kind{font-weight:900;font-size:22px;margin:4px 0 16px;display:flex;gap:10px;align-items:center}
.kind .i{font-size:22px}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 10px;margin-bottom:8px;letter-spacing:.04em}
.big{font-size:30px;font-weight:800;margin:4px 0;line-height:1.25}
.prompt{font-size:22px;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;position:relative}
.wordcard{text-align:center;padding:28px 16px}
.wordcard .big{font-size:36px}
.wordcard .tr{font-size:21px;margin-top:10px}
.pos{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.ex{border-left:4px solid var(--accent);padding:6px 12px;margin:12px 0 0;text-align:left;background:var(--chip);border-radius:0 12px 12px 0}
.tip{white-space:pre-wrap}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{position:relative;padding:14px 16px 14px 52px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);
  text-align:left;font-size:18px;min-height:58px;transition:transform .08s,border-color .15s,background .15s}
.opt .num{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:9px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt small{display:block;color:var(--muted);font-style:italic;font-size:14px}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .num{border-color:var(--accent);color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.badsel{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{padding:12px;text-align:center;font-size:17px;min-height:64px;word-break:break-word}
.match .opt.pair{animation:pairPop .35s;border-color:var(--good);background:var(--good-soft)}
.match .opt.gone{opacity:.35;pointer-events:none;border-bottom-width:2px;transition:opacity .4s .2s}
.match .opt.miss{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
.answer{min-height:68px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin:18px 0;align-content:flex-start;
  background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:8px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:18px;line-height:1.3;
  min-height:48px;will-change:transform;position:relative;z-index:1}
.chip small{display:block;font-size:12px;color:var(--muted);font-style:italic}
.chip.used{background:var(--chip);border-color:var(--chip);color:transparent;pointer-events:none;z-index:0}
.chip.used small{color:transparent}
textarea{width:100%;min-height:120px;border:2px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:18px;
  background:var(--card);color:var(--ink);margin-top:18px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.blank{font-size:24px;margin:12px 0 4px;font-weight:600}
.slot{display:inline-block;min-width:84px;border-bottom:3px solid var(--accent);text-align:center;font-weight:800;color:var(--accent);padding:0 6px}
.slot.fill{animation:popIn .25s}
.chat{display:flex;flex-direction:column;gap:10px}
.line{max-width:86%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--card);border:2px solid var(--line);cursor:pointer;
  text-align:left;animation:stepIn .35s both;font-size:17px}
.line.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--accent-soft);border-color:transparent}
.line .who{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.04em}
.line .tr{color:var(--muted);display:none;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.line.open .tr{display:block;animation:fadeIn .2s}
.note{background:var(--gold-soft);border:0;margin-top:16px}
.note b{display:block;margin-bottom:4px}
/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);z-index:10}
.foot .in{max-width:680px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot.ok{background:var(--good-soft);border-color:transparent;animation:footUp .45s cubic-bezier(.2,1.4,.4,1)}
.foot.no{background:var(--bad-soft);border-color:transparent;animation:footUp .3s ease-out}
.msg{flex:1;min-width:200px;display:flex;gap:12px;align-items:flex-start}
.msg:empty{display:none}
.msg .badge{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;background:var(--card)}
.msg b{display:block;font-size:20px}
.foot.ok .msg b,.foot.ok .badge{color:var(--good)}
.foot.no .msg b,.foot.no .badge{color:var(--bad)}
.foot .go{min-width:160px}
@media (max-width:520px){.foot .go{width:100%}.msg{min-width:100%}}
/* complete */
.done-scr{text-align:center;padding-top:28px}
.done-scr .trophy{font-size:76px;animation:popIn .6s cubic-bezier(.2,1.6,.4,1)}
.done-scr h2{font-size:28px;margin:6px 0 2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.tile{border:2px solid var(--c);border-radius:16px;overflow:hidden;animation:stepIn .4s both}
.tile .k{background:var(--c);color:#fff;font-size:12px;font-weight:900;letter-spacing:.06em;padding:4px;text-transform:uppercase}
.tile .v{font-size:24px;font-weight:900;padding:10px 4px;color:var(--c);font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
/* quit dialog */
.modal{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
.modal.out{opacity:0;transition:opacity .15s}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));
  text-align:center;display:grid;gap:10px;animation:sheetUp .25s cubic-bezier(.2,1.2,.4,1)}
.sheet .ico{font-size:44px}
.sheet p{margin:0 0 6px}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:24px}}
@keyframes stepIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation-name:popInC}
@keyframes popInC{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%)}}
@keyframes pairPop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes footUp{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%{box-shadow:0 6px 0 color-mix(in srgb,var(--lv) 60%,#000),0 0 0 0 color-mix(in srgb,var(--lv) 55%,transparent)}
  70%,100%{box-shadow:0 6px 0 color-mix(in srgb,var(--lv) 60%,#000),0 0 0 18px transparent}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;animation-delay:0s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="db/content.js"></script>
<script src="shared/progress.js"></script>
<script src="shared/exercises.js"></script>
<script>
// Content, learner progress and exercise data come from the shared modules (also used by the other games):
// window.YARYA_DB (db/content.js, built by build_db.py), Yarya.progress, Yarya.ex.
const C = window.YARYA_DB, P = Yarya.progress, X = Yarya.ex, store = Yarya.store, GAME = 'duo';
const T = {
  en: { learn: 'Learn Mongolian', check: 'Check', cont: 'Continue', praise: ['Correct!', 'Nice!', 'Great job!', 'Spot on!', 'Excellent!'],
    wrong: 'Correct answer:', almost: 'Almost! Watch the spelling:', newWord: 'New word', pick: 'Choose the translation',
    match: 'Tap the matching pairs', build: 'Translate this sentence', type: 'Write this in English', blank: 'Fill in the blank',
    dialogue: 'Read the conversation', reveal: 'Tap a line to see the translation', tip: 'Grammar tip',
    done: 'Lesson complete!', perfect: 'Perfect lesson!', accuracy: 'correct', back: 'Back to lessons', notYet: 'Not written yet',

// ---------- Lesson player ----------
